<!-- public/offline.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>You're offline — Ecombio</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #0a0a0a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 28rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { color: #555; margin-bottom: 1.5rem; }
      button {
        border: none;
        border-radius: 6px;
        padding: 0.6rem 1.2rem;
        background: #0a0a0a;
        color: #fff;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Check your connection and try again. Anything already in your cart is safe — it's stored server-side, not on this device.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
